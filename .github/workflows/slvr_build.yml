name: SLVR Windows build
# Slim single-cell build for the SLVR fork: Windows x64, OpenSim flavor (no Havok),
# no FMOD/KDU/BugSplat/signing, so it needs no secrets. Steps mirror build_viewer.yml.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish the installer under Releases (e.g. v0.0.1). Empty = artifact only.'
        required: false
        default: ''

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  AUTOBUILD_VSVER: 170
  XZ_DEFAULTS: -T0

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version revision is derived from git history

      - name: Checkout build vars
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          pip install -r requirements.txt
          choco install nsis -y --no-progress

      - name: Configure
        run: >
          autobuild configure -c ReleaseFS_open -A64 --
          --package
          -DOPENSIM:BOOL=ON -DHAVOK_TPV:BOOL=OFF
          -DUSE_OPENXR:BOOL=ON
          -DLL_TESTS:BOOL=OFF

      - name: Build
        run: autobuild build -c ReleaseFS_open -A64 --no-configure

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SLVR-windows-installer
          path: build-*/newview/Release/*Setup.exe
          if-no-files-found: error

      - name: Publish release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: >
          gh release create "$TAG" build-*/newview/Release/*Setup.exe
          --target "$GITHUB_SHA" --prerelease --title "SLVR $TAG"
          --notes "SLVR is based on Firestorm Viewer and is not affiliated with the Firestorm Project."
